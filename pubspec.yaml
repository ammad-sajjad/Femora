name: femora
description: "Femora - AI Powered Women's Health & Wellness Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.20.3
  provider: ^6.1.1
  http: ^1.2.2
  image_picker: ^1.2.3
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  http_parser: ^4.1.2
  flutter_tts: ^4.2.5
  animated_emoji: ^3.3.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^7.2.0
  qr_flutter: ^4.1.0
  camera: ^0.12.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  archive: ^4.3.0

dependency_overrides:
  path_provider_android: 2.2.15

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Bundled so the mood emojis animate without a connection (the package falls back to the network otherwise).
    - packages/animated_emoji/lottie/smile.json
    - packages/animated_emoji/lottie/sad.json
    - packages/animated_emoji/lottie/angry.json
    - packages/animated_emoji/lottie/tired.json
    - packages/animated_emoji/lottie/anxiousWithSweat.json
    - packages/animated_emoji/lottie/bandageFace.json
    - assets/fonts/NotoNastaliqUrdu-OFL.txt
  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf
